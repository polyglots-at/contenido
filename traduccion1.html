<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Formación de Frases · Diálogo Cotidiano</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px 40px;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 24px 20px 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f0f4fc;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-header h1 { font-size: 1.2rem; font-weight: 700; color: #0b1e3a; }
        .app-header .badge {
            background: #e8edf9; color: #1e3b6b; font-size: 0.7rem;
            font-weight: 600; padding: 6px 14px; border-radius: 30px;
        }

        .progress-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .progress-dot {
            flex: 1;
            min-width: 10px;
            height: 6px;
            border-radius: 6px;
            background: #dee5ef;
            transition: background 0.3s ease;
        }

        .progress-dot.active { background: #2b6df6; }
        .progress-dot.done { background: #2b6df6; opacity: 0.4; }
        .progress-dot.correct { background: #22c55e; }
        .progress-dot.wrong { background: #ef4444; }

        .exercise-content { animation: fadeSlide 0.3s ease; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-weight: 700; font-size: 1rem; color: #0b1e3a;
            margin-bottom: 12px; padding-bottom: 6px;
            border-bottom: 2px solid #2b6df6;
            display: flex; align-items: center; gap: 8px;
        }

        .section-title .step {
            background: #2b6df6; color: white; border-radius: 50%;
            width: 24px; height: 24px; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700;
        }

        .exercise-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
            border: 2px solid #e9eef6;
        }

        .exercise-card .prompt {
            font-size: 1rem;
            font-weight: 600;
            color: #0b1e3a;
            margin-bottom: 10px;
        }

        .exercise-card .prompt .spanish-text {
            background: #f5f9ff;
            padding: 8px 14px;
            border-radius: 10px;
            border-left: 4px solid #2b6df6;
            display: block;
            font-weight: 400;
            font-size: 0.95rem;
            margin-top: 6px;
            color: #1e2f4a;
        }

        .sentence-builder {
            padding: 12px 14px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #e9eef6;
            min-height: 45px;
            font-size: 0.95rem;
            line-height: 1.8;
            color: #0b1e3a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
        }

        .sentence-builder .word-slot {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 6px;
            border: 2px solid #dce3ef;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }

        .sentence-builder .word-slot:active { transform: scale(0.95); }
        .sentence-builder .word-slot.correct { border-color: #22c55e; background: #dcfce7; }
        .sentence-builder .word-slot.wrong { border-color: #ef4444; background: #fecaca; }
        .sentence-builder .placeholder-text {
            color: #aab7d0;
            font-style: italic;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 14px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px dashed #dce3ef;
            min-height: 50px;
            margin-top: 10px;
            justify-content: center;
        }

        .word-chip {
            background: #eef3fc;
            border: 2px solid #dce3ef;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0b1e3a;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
            user-select: none;
        }

        .word-chip:active { transform: scale(0.95); }
        .word-chip.used {
            opacity: 0.3;
            pointer-events: none;
            transform: scale(0.9);
        }
        .word-chip.correct { border-color: #22c55e; background: #dcfce7; color: #166534; }
        .word-chip.wrong { border-color: #ef4444; background: #fecaca; color: #991b1b; }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 60px;
            padding: 10px 14px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-reset { background: #f0f4fc; color: #1d3557; flex: 0.5; }
        .btn-reset:active { background: #dce3ef; transform: scale(0.97); }
        .btn-check { background: #2b6df6; color: white; flex: 1; }
        .btn-check:active { background: #1a56d6; transform: scale(0.97); }
        .btn-check:disabled { opacity: 0.5; pointer-events: none; }

        .feedback-box {
            background: #f8fafc;
            border-radius: 14px;
            padding: 12px 16px;
            margin: 10px 0;
            border: 2px solid #e9eef6;
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .feedback-box.show { display: block; }
        .feedback-box.success { border-color: #86efac; background: #f0fdf4; }
        .feedback-box.error { border-color: #fca5a5; background: #fef2f2; }
        .feedback-box .title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
        .feedback-box .title.success { color: #166534; }
        .feedback-box .title.error { color: #991b1b; }
        .feedback-box .detail { font-size: 0.85rem; line-height: 1.5; color: #1e2f4a; }
        .feedback-box .detail .correct-phrase {
            display: block;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 6px;
            border: 2px solid #22c55e;
            color: #0b1e3a;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .feedback-box .detail .correct-phrase .label {
            color: #5a6f92;
            font-weight: 400;
            font-size: 0.8rem;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 2px solid #f0f4fc;
        }

        .nav-buttons button {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-prev { background: #f0f4fc; color: #1d3557; flex: 0.5; }
        .btn-prev:active { background: #dce3ef; transform: scale(0.97); }
        .btn-next { background: #2b6df6; color: white; flex: 1; }
        .btn-next:active { background: #1a56d6; transform: scale(0.97); }
        .btn-next:disabled { opacity: 0.4; pointer-events: none; }
        .btn-finish { background: #22c55e; color: white; flex: 1; }
        .btn-finish:active { background: #16a34a; transform: scale(0.97); }
        .btn-finish:disabled { opacity: 0.4; pointer-events: none; }

        .completion-screen {
            text-align: center;
            padding: 30px 10px 10px;
            animation: fadeSlide 0.5s ease;
        }

        .completion-screen .icon { font-size: 4rem; margin-bottom: 12px; }
        .completion-screen h2 { color: #0b1e3a; font-size: 1.5rem; margin-bottom: 8px; }
        .completion-screen p { color: #4a5f82; font-size: 0.95rem; line-height: 1.6; max-width: 320px; margin: 0 auto 16px; }
        .completion-screen .btn-restart {
            background: #eef3fc; color: #1d3557; border: none;
            padding: 12px 30px; border-radius: 50px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: 0.2s; touch-action: manipulation;
        }
        .completion-screen .btn-restart:active { background: #dce3ef; transform: scale(0.97); }

        .completion-screen .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        .completion-screen .stat-item { text-align: center; }
        .completion-screen .stat-item .number {
            font-size: 1.8rem;
            font-weight: 700;
            display: block;
        }
        .completion-screen .stat-item .number.green { color: #22c55e; }
        .completion-screen .stat-item .number.red { color: #ef4444; }
        .completion-screen .stat-item .number.blue { color: #2b6df6; }
        .completion-screen .stat-item .label { font-size: 0.75rem; color: #5a6f92; }

        @media (max-width: 450px) {
            .app-container { padding: 16px 12px 20px; }
            .exercise-card { padding: 14px 14px; }
            .exercise-card .prompt { font-size: 0.9rem; }
            .word-chip { font-size: 0.85rem; padding: 6px 14px; }
            .sentence-builder { font-size: 0.85rem; padding: 10px 12px; }
            .action-buttons button { font-size: 0.8rem; padding: 8px 10px; }
            .nav-buttons button { font-size: 0.85rem; padding: 10px 8px; }
        }

        @media (max-width: 380px) {
            .app-container { padding: 12px 8px 16px; }
            .exercise-card { padding: 10px 10px; }
            .exercise-card .prompt { font-size: 0.85rem; }
            .word-chip { font-size: 0.8rem; padding: 5px 12px; }
            .sentence-builder { font-size: 0.8rem; padding: 8px 10px; }
            .sentence-builder .word-slot { padding: 2px 8px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">

    <header class="app-header">
        <h1>🧩 Formación de Frases</h1>
        <span class="badge">12 sesiones · 48 líneas</span>
    </header>

    <div class="progress-bar" id="progressBar"></div>

    <div id="contentArea"></div>

</div>

<script>
    // ================================================================
    //  DIÁLOGO COMPLETO - 48 LÍNEAS (12 sesiones × 4 líneas)
    //  Temas: saludos, presentaciones, profesiones, colores,
    //  partes de la casa, cuerpo, familia, ropa, descripciones, gustos
    // ================================================================
    const dialogLines = [
        // SESIÓN 1: Saludos
        { id: 1, speaker: 'A', english: 'Hello! Good morning. How are you today?', spanish: '¡Hola! Buenos días. ¿Cómo estás hoy?' },
        { id: 2, speaker: 'B', english: 'Hi! Good morning. I am very well, thank you.', spanish: '¡Hola! Buenos días. Estoy muy bien, gracias.' },
        { id: 3, speaker: 'A', english: 'I am happy to see you. Are you a student?', spanish: 'Me alegra verte. ¿Eres estudiante?' },
        { id: 4, speaker: 'B', english: 'Yes, I am a student. My name is Carlos.', spanish: 'Sí, soy estudiante. Me llamo Carlos.' },

        // SESIÓN 2: Presentaciones
        { id: 5, speaker: 'A', english: 'Nice to meet you, Carlos. I am Ana.', spanish: 'Mucho gusto, Carlos. Soy Ana.' },
        { id: 6, speaker: 'B', english: 'Nice to meet you too, Ana. Where are you from?', spanish: 'Mucho gusto también, Ana. ¿De dónde eres?' },
        { id: 7, speaker: 'A', english: 'I am from Mexico City. It is a big and beautiful city.', spanish: 'Soy de la Ciudad de México. Es una ciudad grande y hermosa.' },
        { id: 8, speaker: 'B', english: 'I am from Spain, but I live in Madrid.', spanish: 'Soy de España, pero vivo en Madrid.' },

        // SESIÓN 3: Familia y profesiones
        { id: 9, speaker: 'A', english: 'Do you have a big family?', spanish: '¿Tienes una familia grande?' },
        { id: 10, speaker: 'B', english: 'Yes, I have a mother, a father, and two sisters.', spanish: 'Sí, tengo una madre, un padre y dos hermanas.' },
        { id: 11, speaker: 'A', english: 'My mother is a nurse and my father is an engineer.', spanish: 'Mi madre es enfermera y mi padre es ingeniero.' },
        { id: 12, speaker: 'B', english: 'My sister is a doctor. She works in a big hospital.', spanish: 'Mi hermana es médico. Ella trabaja en un hospital grande.' },

        // SESIÓN 4: Descripciones físicas
        { id: 13, speaker: 'A', english: 'What does your sister look like?', spanish: '¿Cómo es tu hermana físicamente?' },
        { id: 14, speaker: 'B', english: 'She is tall and thin. She has long brown hair.', spanish: 'Ella es alta y delgada. Tiene pelo largo castaño.' },
        { id: 15, speaker: 'A', english: 'Does she have blue eyes or green eyes?', spanish: '¿Tiene ojos azules o verdes?' },
        { id: 16, speaker: 'B', english: 'She has beautiful green eyes and a friendly smile.', spanish: 'Tiene hermosos ojos verdes y una sonrisa amable.' },

        // SESIÓN 5: Ropa y colores
        { id: 17, speaker: 'A', english: 'What is she wearing today?', spanish: '¿Qué lleva puesto hoy?' },
        { id: 18, speaker: 'B', english: 'She is wearing a red dress and black shoes.', spanish: 'Lleva un vestido rojo y zapatos negros.' },
        { id: 19, speaker: 'A', english: 'I love the color red. It is very bright and cheerful.', spanish: 'Me encanta el color rojo. Es muy brillante y alegre.' },
        { id: 20, speaker: 'B', english: 'Yes, red is my favorite color too!', spanish: '¡Sí, el rojo es mi color favorito también!' },

        // SESIÓN 6: Partes de la casa
        { id: 21, speaker: 'A', english: 'Do you have a big house?', spanish: '¿Tienes una casa grande?' },
        { id: 22, speaker: 'B', english: 'Yes, I have a house with four bedrooms and a garden.', spanish: 'Sí, tengo una casa con cuatro dormitorios y un jardín.' },
        { id: 23, speaker: 'A', english: 'My house has a big kitchen and a comfortable living room.', spanish: 'Mi casa tiene una cocina grande y un salón cómodo.' },
        { id: 24, speaker: 'B', english: 'I love the garden. It has beautiful flowers and green trees.', spanish: 'Me encanta el jardín. Tiene flores hermosas y árboles verdes.' },

        // SESIÓN 7: Colores de la naturaleza
        { id: 25, speaker: 'A', english: 'What color are the flowers in your garden?', spanish: '¿De qué color son las flores de tu jardín?' },
        { id: 26, speaker: 'B', english: 'They are red, yellow, purple, and white.', spanish: 'Son rojas, amarillas, moradas y blancas.' },
        { id: 27, speaker: 'A', english: 'That sounds amazing! I would like to see them.', spanish: '¡Eso suena increíble! Me gustaría verlas.' },
        { id: 28, speaker: 'B', english: 'You are welcome to visit my house anytime.', spanish: 'Eres bienvenido a visitar mi casa en cualquier momento.' },

        // SESIÓN 8: Rutina y actividades
        { id: 29, speaker: 'A', english: 'What do you do in your free time?', spanish: '¿Qué haces en tu tiempo libre?' },
        { id: 30, speaker: 'B', english: 'I like to read books and listen to music.', spanish: 'Me gusta leer libros y escuchar música.' },
        { id: 31, speaker: 'A', english: 'I love music too. I play the guitar and sing.', spanish: 'A mí también me encanta la música. Toco la guitarra y canto.' },
        { id: 32, speaker: 'B', english: 'That is wonderful! I would like to hear you play.', spanish: '¡Eso es maravilloso! Me gustaría escucharte tocar.' },

        // SESIÓN 9: Partes del cuerpo
        { id: 33, speaker: 'A', english: 'I have a headache today. I need to rest.', spanish: 'Tengo dolor de cabeza hoy. Necesito descansar.' },
        { id: 34, speaker: 'B', english: 'Oh no! You should drink water and take a break.', spanish: '¡Oh no! Deberías beber agua y tomar un descanso.' },
        { id: 35, speaker: 'A', english: 'My eyes are tired too. I need to close them for a moment.', spanish: 'Mis ojos también están cansados. Necesito cerrarlos un momento.' },
        { id: 36, speaker: 'B', english: 'You should rest your eyes. Look at the green trees outside.', spanish: 'Deberías descansar tus ojos. Mira los árboles verdes afuera.' },

        // SESIÓN 10: Comida y gustos
        { id: 37, speaker: 'A', english: 'What is your favorite food?', spanish: '¿Cuál es tu comida favorita?' },
        { id: 38, speaker: 'B', english: 'I love pizza and hamburgers. They are delicious!', spanish: 'Me encanta la pizza y las hamburguesas. ¡Son deliciosas!' },
        { id: 39, speaker: 'A', english: 'I prefer healthy food like salads and fruit.', spanish: 'Prefiero comida saludable como ensaladas y fruta.' },
        { id: 40, speaker: 'B', english: 'That is good for your health! I should eat more vegetables.', spanish: '¡Eso es bueno para tu salud! Debería comer más verduras.' },

        // SESIÓN 11: Lugares y direcciones
        { id: 41, speaker: 'A', english: 'Where is your classroom?', spanish: '¿Dónde está tu clase?' },
        { id: 42, speaker: 'B', english: 'My classroom is on the second floor, next to the library.', spanish: 'Mi clase está en el segundo piso, al lado de la biblioteca.' },
        { id: 43, speaker: 'A', english: 'I like to study in the library. It is very quiet there.', spanish: 'Me gusta estudiar en la biblioteca. Es muy tranquilo allí.' },
        { id: 44, speaker: 'B', english: 'Me too! The library has many books and comfortable chairs.', spanish: '¡Yo también! La biblioteca tiene muchos libros y sillas cómodas.' },

        // SESIÓN 12: Despedidas
        { id: 45, speaker: 'A', english: 'It is getting late. I have to go now.', spanish: 'Se está haciendo tarde. Tengo que irme ahora.' },
        { id: 46, speaker: 'B', english: 'Oh, already? It was nice talking to you.', spanish: '¿Oh, ya? Fue agradable hablar contigo.' },
        { id: 47, speaker: 'A', english: 'Thank you for the conversation. See you tomorrow!', spanish: 'Gracias por la conversación. ¡Hasta mañana!' },
        { id: 48, speaker: 'B', english: 'See you tomorrow! Have a wonderful day!', spanish: '¡Hasta mañana! ¡Que tengas un día maravilloso!' }
    ];

    // ================================================================
    //  DIVIDIR EN SESIONES (4 líneas por sesión)
    // ================================================================
    const LINES_PER_SESSION = 4;
    const sessions = [];
    for (let i = 0; i < dialogLines.length; i += LINES_PER_SESSION) {
        sessions.push(dialogLines.slice(i, i + LINES_PER_SESSION));
    }
    const totalSessions = sessions.length;

    // ================================================================
    //  FUNCIONES AUXILIARES
    // ================================================================
    function getSpeakerLabel(speaker) {
        return speaker === 'A' ? 'Ana:' : 'Carlos:';
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ================================================================
    //  ESTADO
    // ================================================================
    let currentSession = 0;
    const sessionStates = sessions.map(() => ({
        selectedLines: [],
        verified: false,
        lineStatus: []
    }));

    // ================================================================
    //  REFERENCIAS DOM
    // ================================================================
    const contentArea = document.getElementById('contentArea');
    const progressBar = document.getElementById('progressBar');

    // ================================================================
    //  RENDERIZAR PROGRESO
    // ================================================================
    function renderProgress() {
        let html = '';
        for (let i = 0; i < totalSessions; i++) {
            const state = sessionStates[i];
            let cls = 'progress-dot';
            if (i === currentSession) cls += ' active';
            else if (state.verified) {
                const hasError = state.lineStatus.some(s => s === 'wrong');
                cls += hasError ? ' wrong' : ' correct';
            } else if (i < currentSession) {
                cls += ' done';
            }
            html += `<span class="${cls}"></span>`;
        }
        progressBar.innerHTML = html;
    }

    // ================================================================
    //  RENDERIZAR SESIÓN
    // ================================================================
    function renderSession(index) {
        const session = sessions[index];
        const state = sessionStates[index];
        const isVerified = state.verified;
        const isLast = (index === totalSessions - 1);

        // Guía en español
        const spanishGuide = session.map(line =>
            `<span class="turno" style="display:block; padding:2px 0; border-bottom:1px dashed #e2e8f0;">
                <span style="font-weight:700; color:#2b6df6;">${getSpeakerLabel(line.speaker)}</span> ${line.spanish}
            </span>`
        ).join('');

        let html = `
            <div class="exercise-content">
                <div class="section-title">
                    <span class="step">${index + 1}</span>
                    Sesión ${index + 1} de ${totalSessions}
                    <span style="font-weight:400; font-size:0.75rem; color:#4a5f82; margin-left:auto;">${session.length} líneas</span>
                </div>

                <div class="exercise-card">
                    <div class="prompt">
                        📖 Guía en español (orden correcto):
                        <span class="spanish-text">${spanishGuide}</span>
                    </div>

                    <div style="margin-top:10px; font-weight:600; color:#0b1e3a; font-size:0.9rem;">
                        Toca las líneas en el orden correcto:
                    </div>

                    <div class="sentence-builder" id="sentenceBuilder">
        `;

        const selectedLines = state.selectedLines || [];

        if (selectedLines.length === 0) {
            html += `<span class="placeholder-text">👆 Selecciona líneas del banco de abajo</span>`;
        } else {
            selectedLines.forEach((line, idx) => {
                let cls = 'word-slot';
                if (isVerified) {
                    const correctLine = session[idx];
                    cls += (correctLine && line.id === correctLine.id) ? ' correct' : ' wrong';
                }
                html += `<span class="${cls}" data-pos="${idx}">${getSpeakerLabel(line.speaker)} ${line.english} ✕</span>`;
            });
        }

        html += `
                    </div>

                    <div class="word-bank" id="wordBank">
        `;

        if (isVerified) {
            session.forEach((line, idx) => {
                const isCorrect = state.selectedLines[idx] && state.selectedLines[idx].id === line.id;
                html += `<span class="word-chip ${isCorrect ? 'correct' : 'wrong'}">${getSpeakerLabel(line.speaker)} ${line.english}</span>`;
            });
            // Mostrar la frase correcta completa
            const correctText = session.map(l => `${getSpeakerLabel(l.speaker)} ${l.english}`).join(' ');
            html += `
                </div>
                <div style="margin-top:10px; padding:10px 14px; background:#f0fdf4; border-radius:10px; border:2px solid #86efac; font-size:0.9rem; color:#166534;">
                    ✅ Frase correcta: <strong>${correctText}</strong>
                </div>
            `;
        } else {
            const available = session.filter(line =>
                !state.selectedLines.some(sel => sel.id === line.id)
            );
            const shuffled = shuffleArray(available);
            if (shuffled.length === 0) {
                html += `<span style="color:#94a3b8; font-style:italic;">Todas las líneas seleccionadas</span>`;
            } else {
                shuffled.forEach(line => {
                    html += `<span class="word-chip" data-lineid="${line.id}" data-speaker="${line.speaker}" data-english="${line.english}">${getSpeakerLabel(line.speaker)} ${line.english}</span>`;
                });
            }
            html += `</div>`;
        }

        html += `
                </div>

                <!-- FEEDBACK -->
                <div class="feedback-box ${isVerified ? 'show' : ''} ${isVerified && !state.lineStatus.some(s => s === 'wrong') ? 'success' : isVerified ? 'error' : ''}" id="feedbackBox">
                    <div class="title" id="feedbackTitle"></div>
                    <div class="detail" id="feedbackDetail"></div>
                </div>

                <!-- ACCIONES -->
                <div class="action-buttons">
                    <button class="btn-reset" id="resetBtn">🔄 Reiniciar</button>
                    <button class="btn-check" id="checkBtn" ${isVerified ? 'disabled' : ''}>
                        ${isVerified ? '✅ Verificado' : '✓ Verificar'}
                    </button>
                </div>

                <!-- NAVEGACIÓN -->
                <div class="nav-buttons">
                    <button class="btn-prev" id="prevBtn" ${index === 0 ? 'disabled' : ''}>
                        ◀ Anterior
                    </button>
                    ${isLast ? `
                        <button class="btn-finish" id="finishBtn" ${!isVerified ? 'disabled' : ''}>
                            🏁 Finalizar
                        </button>
                    ` : `
                        <button class="btn-next" id="nextBtn" ${!isVerified ? 'disabled' : ''}>
                            Siguiente ▶
                        </button>
                    `}
                </div>
            </div>
        `;

        contentArea.innerHTML = html;
        renderProgress();

        // ============================================================
        //  EVENTOS
        // ============================================================

        // --- Seleccionar línea del banco ---
        if (!isVerified) {
            const wordChips = document.querySelectorAll('#wordBank .word-chip');
            wordChips.forEach(chip => {
                chip.addEventListener('click', function(e) {
                    e.preventDefault();
                    const lineId = parseInt(this.dataset.lineid);
                    const line = session.find(l => l.id === lineId);
                    if (line) {
                        state.selectedLines.push(line);
                        renderSession(index);
                        const checkBtn = document.getElementById('checkBtn');
                        if (checkBtn && state.selectedLines.length > 0) {
                            checkBtn.disabled = false;
                        }
                    }
                });
            });

            // --- Eliminar línea de la frase ---
            const slots = document.querySelectorAll('#sentenceBuilder .word-slot');
            slots.forEach(slot => {
                slot.addEventListener('click', function(e) {
                    e.preventDefault();
                    const pos = parseInt(this.dataset.pos);
                    if (!isNaN(pos) && state.selectedLines && pos >= 0 && pos < state.selectedLines.length) {
                        state.selectedLines.splice(pos, 1);
                        renderSession(index);
                    }
                });
            });
        }

        // --- Reiniciar ---
        const resetBtn = document.getElementById('resetBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', function(e) {
                e.preventDefault();
                state.selectedLines = [];
                state.verified = false;
                state.lineStatus = [];
                renderSession(index);
            });
        }

        // --- Verificar ---
        const checkBtn = document.getElementById('checkBtn');
        if (checkBtn && !isVerified) {
            checkBtn.addEventListener('click', function(e) {
                e.preventDefault();

                const selected = state.selectedLines;
                const correct = session;

                const statuses = [];
                let allCorrect = true;

                for (let i = 0; i < correct.length; i++) {
                    if (i < selected.length && selected[i].id === correct[i].id) {
                        statuses.push('correct');
                    } else {
                        statuses.push('wrong');
                        allCorrect = false;
                    }
                }

                if (selected.length > correct.length) {
                    for (let i = correct.length; i < selected.length; i++) {
                        statuses.push('wrong');
                        allCorrect = false;
                    }
                }

                state.verified = true;
                state.lineStatus = statuses;

                renderSession(index);

                // Mostrar feedback
                const box = document.getElementById('feedbackBox');
                const title = document.getElementById('feedbackTitle');
                const detail = document.getElementById('feedbackDetail');

                if (box && title && detail) {
                    box.classList.add('show');
                    const correctText = session.map(l => `${getSpeakerLabel(l.speaker)} ${l.english}`).join(' ');

                    if (allCorrect) {
                        box.className = 'feedback-box show success';
                        title.className = 'title success';
                        title.textContent = '🎉 ¡Excelente! Todas las líneas están en el orden correcto.';
                        detail.innerHTML = `
                            Has ordenado correctamente las ${session.length} líneas de esta sesión. ¡Gran trabajo!
                            <div class="correct-phrase">
                                <span class="label">✅ Frase correcta:</span>
                                ${correctText}
                            </div>
                        `;
                    } else {
                        box.className = 'feedback-box show error';
                        title.className = 'title error';
                        title.textContent = '❌ Algunas líneas están fuera de orden';

                        // Encontrar líneas incorrectas
                        let wrongLines = [];
                        for (let i = 0; i < correct.length; i++) {
                            const userLine = selected[i] || null;
                            const correctLine = correct[i];
                            if (!userLine || userLine.id !== correctLine.id) {
                                wrongLines.push(`"${getSpeakerLabel(correctLine.speaker)} ${correctLine.english}"`);
                            }
                        }

                        detail.innerHTML = `
                            La frase correcta es:
                            <div class="correct-phrase">
                                <span class="label">✅ Frase correcta:</span>
                                ${correctText}
                            </div>
                            <div style="margin-top:6px; color:#5a6f92; font-size:0.85rem;">
                                💡 Recuerda el orden del diálogo en español para guiarte.
                            </div>
                        `;
                    }
                }

                const nextBtn = document.getElementById('nextBtn');
                const finishBtn = document.getElementById('finishBtn');
                if (nextBtn) nextBtn.disabled = false;
                if (finishBtn) finishBtn.disabled = false;
            });
        }

        // --- Navegación ---
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const finishBtn = document.getElementById('finishBtn');

        if (prevBtn) {
            prevBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (currentSession > 0) {
                    currentSession--;
                    renderSession(currentSession);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (currentSession < totalSessions - 1) {
                    currentSession++;
                    renderSession(currentSession);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        if (finishBtn) {
            finishBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showCompletionScreen();
            });
        }
    }

    // ================================================================
    //  PANTALLA DE FINALIZACIÓN
    // ================================================================
    function showCompletionScreen() {
        let correctCount = 0;
        let wrongCount = 0;

        sessionStates.forEach(state => {
            if (state.verified) {
                const hasError = state.lineStatus.some(s => s === 'wrong');
                if (hasError) wrongCount++;
                else correctCount++;
            }
        });

        const total = correctCount + wrongCount;
        const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;

        // Mostrar todas las líneas del diálogo
        const fullDialog = dialogLines.map(line =>
            `<div style="font-size:0.85rem; padding:2px 0; border-bottom:1px solid #e9eef6; display:flex; gap:6px;">
                <span style="font-weight:700; color:#2b6df6; min-width:50px;">${getSpeakerLabel(line.speaker)}</span>
                <span>${line.english}</span>
            </div>`
        ).join('');

        contentArea.innerHTML = `
            <div class="completion-screen">
                <div class="icon">🎉</div>
                <h2>¡Diálogo completado!</h2>
                <p>Has practicado todas las sesiones del diálogo cotidiano (48 líneas).</p>

                <div class="stats">
                    <div class="stat-item">
                        <span class="number green">${correctCount}</span>
                        <span class="label">✅ Correctas</span>
                    </div>
                    <div class="stat-item">
                        <span class="number red">${wrongCount}</span>
                        <span class="label">❌ Incorrectas</span>
                    </div>
                    <div class="stat-item">
                        <span class="number blue">${accuracy}%</span>
                        <span class="label">🎯 Precisión</span>
                    </div>
                </div>

                <div style="background:#f8fafc; border-radius:14px; padding:14px; margin:12px 0; text-align:left; max-height:250px; overflow-y:auto; border:1px solid #e9eef6;">
                    <div style="font-weight:700; font-size:0.85rem; color:#0b1e3a; margin-bottom:6px;">📖 Diálogo completo (48 líneas):</div>
                    ${fullDialog}
                </div>

                <button class="btn-restart" id="restartBtn">🔄 Repetir actividad</button>
            </div>
        `;

        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) {
            restartBtn.addEventListener('click', function(e) {
                e.preventDefault();
                sessionStates.forEach(state => {
                    state.selectedLines = [];
                    state.verified = false;
                    state.lineStatus = [];
                });
                currentSession = 0;
                renderSession(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    // ================================================================
    //  INICIALIZAR
    // ================================================================
    renderSession(0);
</script>

</body>
</html>
